version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: microservices
    ports:
      - "5432:5432"
    networks:
      - microservices

  response-processor:
    build: ./services/response-processor
    container_name: response-processor
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - microservices

  form-service:
    build: ./services/form-service
    container_name: form-service
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    networks:
      - microservices

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "8002:8002"
    depends_on:
      - rabbitmq
    networks:
      - microservices

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - response-processor
      - form-service
      - notification-service
    networks:
      - microservices

networks:
  microservices:
    driver: bridge